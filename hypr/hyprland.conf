# Discord panes (PanePopout plugin + discord-panes helper), for classic hyprland.conf setups.
# Add these to your hyprland.conf (Omarchy / Lua-config users: see bindings.lua instead).
bind = SUPER ALT, D, exec, ~/.local/bin/discord-panes toggle
bind = SUPER ALT SHIFT, D, exec, ~/.local/bin/discord-panes help
